<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="site-search">
        <input
          type="search"
          id="site-search-input"
          placeholder="Search FAQ &amp; manual..."
          autocomplete="off"
          data-search-url="{{ '/search.json' | relative_url }}">
        <div id="site-search-results" class="search-results" hidden></div>
      </div>
      <nav>
        <a href="{{ '/faq/' | relative_url }}">FAQ</a>
        <a href="{{ '/manual/' | relative_url }}">Manual</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Content migrated from animaze.us.</p>
    </div>
  </footer>
</body>
</html>
