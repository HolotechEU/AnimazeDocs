<h1>新しいテクスチャーが真っ黒になっています</h1>
<div class="aw-faq-search">

</div><div class="aw-page-container">
<p></p><p><span><span></span></span></p>
<p dir="ltr"><span style="font-size: 12px;">大きなテクスチャーや、たくさんの小さなテクスチャーを連続してアップロードした場合、Open GLで</span><span style="font-size: 12px;">Out of Videoエラー</span><span style="font-size: 12px;">が発生する場合があります。以下の画像のように、アップロードしたテクスチャーが黒くなっている場合、このエラーが発生している可能性があります。</span></p>
<p><img height="280" src="https://lh6.googleusercontent.com/n3NXYTj3ZlU8CgYLtWELaEd7FA-hfvZfhhAl0hQCO-Cvv3GA18dDTHxioynIRtNaja9sfLxU9e575vBnP-GNmXhKBELyhoLsjF3RORoZ25ZXExvf_4hmoUqXgdTxEZbWa8sHvCs" width="447"/></p>
<p>エラーが発生した場合、新しいテクスチャーを適用したアバターを保存し、アプリを再起動します。アプリの再起動後、設定したテクスチャーが適用されたアバターが表示されます。 </p>
