<h1>言語を変更するにはどうすればよいですか?</h1>
<div class="aw-faq-search">

</div><div class="aw-page-container">
<p></p><p><span><span></span></span></p>
<p dir="ltr"><span style="font-size: 12px;">次の手順でAnimazeの言語を変更します:</span></p>
<p>1.画面上部のメニューバーで「Animaze」 &gt; 「設定」の順にクリックします</p>
<p><span><span></span></span></p>
<p dir="ltr"><img height="477" src="../../../assets/images/01_3-65ddc929.png" width="800"/></p>
<p><span><span><br/></span></span></p>
<p dir="ltr"><span>2.「言語」をクリックし、使用したい言語を選択します</span></p>
<p><span><span><br/></span></span></p>
<p dir="ltr"><img height="516" src="../../../assets/images/02_3-a9e82eaf.png" width="800"/></p>
<p><span><span><br/></span></span></p>
<p dir="ltr"><span>3.Animazeを再起動した後に選択した言語が反映されます</span></p>
<p><span><span></span></span></p>
<div><span><br/></span></div>
</div>
