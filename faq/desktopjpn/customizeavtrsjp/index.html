<h1>アバターのシェイプと色をカスタマイズするにはどうすればよいですか？</h1>
<div class="aw-faq-search">

</div><div class="aw-page-container">
<p></p><p><span><span></span></span></p>
<p dir="ltr"><span><span></span></span></p>
<p>1.左メニューの<b>アバター</b>アイコンをクリックし、アバターを選択して「カスタマイズ」をクリックします</p>
<p dir="ltr"><img alt="Avatar Customization and Retexturing" height="611" src="../../../assets/images/Avatar_Customization_and_Retexturing01-23ef0d6f.png" title="Avatar Customization and Retexturing" width="790"/> </p>
<p dir="ltr"><span><span></span></span></p>
<p dir="ltr"><span>2.</span><span>カスタマイズウインドウには</span><span>4</span><span>つのタブがあり、色やサイズやテクスチャーを変更する際にそれぞれを開きます。</span></p>
<p dir="ltr"><img alt="Avatar Customization and Retexturing" height="781" src="../../../assets/images/Avatar_Customization_and_Retexturing02-1be25364.png" title="Avatar Customization and Retexturing" width="790"/> </p>
<p>ヒント:アバターの色を変更するにはカラーホイールを使用します。</p>
<p>3.「<b>保存</b>」をクリックして、カスタマイズしたアバターを保存します</p>
<p dir="ltr"><img alt="Avatar Customization and Retexturing" height="898" src="../../../assets/images/Avatar_Customization_and_Retexturing03-85f8082e.png" title="Avatar Customization and Retexturing" width="790"/></p>
