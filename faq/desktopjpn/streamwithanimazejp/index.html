<h1>Animazeと他のソフトウェアを使用して配信するにはどうすればよいですか?</h1>
<div class="aw-faq-search">

</div><div class="aw-page-container">
<p></p><p><span><span></span></span></p>
<p dir="ltr"><span style="font-size: 12px;">Animazeは主要な配信用ソフトウェアとの互換性があります。ここではOBSを例に手順を説明します。  </span></p>
<p><span><span></span></span></p>
<p dir="ltr"><span>1.OBSを開き、新しいシーンを作成します </span></p>
<p><span><span></span></span></p>
<p dir="ltr"><img height="416" src="../../../assets/images/44_01How_do_I_stream_with_Animaze_and_other_software-4f500629.png" width="512"/></p>
<p><span><span></span></span></p>
<p dir="ltr"><span>2.ソースで「映像キャプチャデバイス」を選択します</span></p>
<p><span><span></span></span></p>
<p dir="ltr"><span>3.デバイスのドロップダウンメニューから「Animazeバーチャルカメラ」を選択し「OK」をクリックします</span></p>
<p><span><span></span></span></p>
<p dir="ltr"><img height="516" src="../../../assets/images/44_02How_do_I_stream_with_Animaze_and_other_software-bd3ee40b.png" width="700"/></p>
<p><span><span></span></span></p>
<p dir="ltr"><span>4.Animazeで「放送」オプションがオンになっていることを確認してください</span></p>
<p><img height="454" src="../../../assets/images/44_03How_do_I_stream_with_Animaze_and_other_software-da657aca.png" width="800"/></p>
<p><span><span></span></span></p>
<div><span><span><br/></span></span></div>
